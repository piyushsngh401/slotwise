version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      aspire:
        patterns: ["Aspire.*"]
      opentelemetry:
        patterns: ["OpenTelemetry.*"]
      microsoft:
        patterns: ["Microsoft.*"]
      testing:
        patterns: ["xunit*", "Shouldly", "NetArchTest.*", "coverlet.*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
