name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build, lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      - name: Restore
        run: dotnet restore Slotwise.slnx

      - name: Check formatting
        run: dotnet format Slotwise.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Slotwise.slnx --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test
          --solution Slotwise.slnx
          --configuration Release
          --no-build
          --results-directory "$GITHUB_WORKSPACE/TestResults"
          --report-xunit-trx
          --coverage
          --coverage-output-format cobertura

      - name: Annotate failed tests
        if: failure()
        run: python3 .github/scripts/annotate_trx.py TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore
